name: Submit News Article
description: Submit a new news entry for the website.
title: "[News]: "
labels: ["news-submission"]
body:
  - type: input
    id: title
    attributes:
      label: title
      description: The headline of the news article.
      placeholder: Paper accepted at XYZ Conference 🎉
    validations:
      required: true
  - type: input
    id: date
    attributes:
      label: date
      description: "YYYY-MM-DD. Leave empty to use today."
  - type: textarea
    id: content
    attributes:
      label: content
      description: The body of the article (Markdown supported).
    validations:
      required: true
  - type: textarea
    id: featured_image_optional
    attributes:
      label: Featured Image (optional)
      description: "Drag and drop an image here. It will be saved as featured.jpg"
      placeholder: "Drag an image file here..."
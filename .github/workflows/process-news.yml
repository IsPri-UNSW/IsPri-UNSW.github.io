name: Process News Submission

on:
  issues:
    types: [opened]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  create-news-article:
    if: contains(github.event.issue.labels.*.name, 'news-submission')
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Python dependencies
        run: pip install -r scripts/requirements.txt

      - name: Parse issue body
        id: parse
        uses: stefanbuck/github-issue-parser@v3

      - name: Create news article
        id: create
        env:
          # defining env vars here avoids the shell injection risks of 'echo'
          TITLE: ${{ fromJson(steps.parse.outputs.jsonString).title }}
          DATE: ${{ fromJson(steps.parse.outputs.jsonString).article_date }}
          CONTENT: ${{ fromJson(steps.parse.outputs.jsonString).content }}
          FEATURED_IMAGE: ${{ fromJson(steps.parse.outputs.jsonString).featured_image }}
        run: |
          # Extract image URL from markdown if present
          IMAGE_URL=""
          if [ -n "$FEATURED_IMAGE" ]; then
            IMAGE_URL=$(echo "$FEATURED_IMAGE" | grep -oP '!\[.*?\]\(\K[^)]+' || echo "")
          fi
          
          # Use the environment variables safely with double quotes
          if [ -n "$DATE" ]; then
            python3 scripts/add_news.py --title "$TITLE" --date "$DATE" --content "$CONTENT" --image-url "$IMAGE_URL"
          else
            python3 scripts/add_news.py --title "$TITLE" --content "$CONTENT" --image-url "$IMAGE_URL"
          fi
          
          # Generate folder name for the branch
          # Using printf is safer than echo for variable processing
          SLUG=$(printf "%s" "$TITLE" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9-]/-/g' | sed 's/--*/-/g' | sed 's/^-//' | sed 's/-$//')
          DATE_PREFIX=$(date +%y-%m-%d)
          FOLDER_NAME="${DATE_PREFIX}-${SLUG}"
          
          echo "folder_name=${FOLDER_NAME}" >> $GITHUB_OUTPUT

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "feat: add news '${{ fromJson(steps.parse.outputs.jsonString).title }}'"
          branch: "news/${{ steps.create.outputs.folder_name }}"
          delete-branch: true
          title: "News: ${{ fromJson(steps.parse.outputs.jsonString).title }}"
          body: |
            ## New News Article
            
            **Title:** ${{ fromJson(steps.parse.outputs.jsonString).title }}
            **Date:** ${{ fromJson(steps.parse.outputs.jsonString).article_date || 'Today' }}
            
            This PR was automatically created from issue #${{ github.event.issue.number }}.
            
            Closes #${{ github.event.issue.number }}
          labels: news

      - name: Comment on issue
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ News article created! A pull request has been opened for review.'
            });